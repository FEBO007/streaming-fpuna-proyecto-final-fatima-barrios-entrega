[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming-fpuna-proyecto-final-fatima-barrios"
version = "0.1.0"
description = "Reproducible event-time velocity-alert pipeline with Kafka and Apache Beam."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "apache-beam==2.75.0",
    "confluent-kafka==2.12.2",
]

[project.scripts]
streaming-producer = "src.producer.synthetic_producer:main"
streaming-skew-analysis = "src.producer.skew_analysis:main"
streaming-pipeline = "src.pipeline.streaming_pipeline:main"
streaming-alert-consumer = "src.materializer.alert_consumer:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests without external services",
    "temporal: event-time, windowing, and lateness tests",
    "integration: tests requiring Kafka or other infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
